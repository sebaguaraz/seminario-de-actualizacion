<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 10</title>
</head>

<body>


</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();

            this.lineData = [
                {
                    points: [
                        { x: 100, y: 100 },
                        { x: 200, y: 50 },
                        { x: 300, y: 100 }
                    ],
                    lineCap: "butt",
                    lineJoin: "bevel"
                },
                {
                    points: [
                        { x: 100, y: 200 },
                        { x: 200, y: 150 },
                        { x: 300, y: 200 }
                    ],
                    lineCap: "round",
                    lineJoin: "round"
                },
                {
                    points: [
                        { x: 100, y: 300 },
                        { x: 200, y: 250 },
                        { x: 300, y: 300 }
                    ],
                    lineCap: "square",
                    lineJoin: "miter"
                }
            ];
        }

        getLineData() {
            return this.lineData;
        }
        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {

        constructor() {
            super()
            this.canvas = document.createElement("canvas")
            this.canvas.width = 800
            this.canvas.height = 800
            this.canvas.style = "border: 1px solid black; "
            this.pincel2D = this.canvas.getContext("2d")

            this.h1 = document.createElement("h1")
            this.h1.textContent = "10) Dibujar un conjunto de tres líneas quebradas independientes (cada una formada por 3 puntos) aplicando en cada una un estilo diferente de terminación de extremos (butt, round, square) y de unión de esquinas (bevel, round, miter)."

            this.appendChild(this.h1)
            this.appendChild(this.canvas)

        }

        drawLines(lines) {
            for (const line of lines) {
                this.pincel2D.lineCap = line.lineCap;
                this.pincel2D.lineJoin = line.lineJoin;
                this.pincel2D.lineWidth = 10;

                this.pincel2D.beginPath();

                this.pincel2D.moveTo(
                    line.points[0].x,
                    line.points[0].y
                );

                for (let index = 1; index < line.points.length; index++) {
                    this.pincel2D.lineTo(
                        line.points[index].x,
                        line.points[index].y
                    );
                }

                this.pincel2D.stroke();
            }
        }

        render(data) {
            this.pincel2D.clearRect(0, 0, this.canvas.width, this.canvas.height);

            this.drawLines(data);
        }

        connectedCallback() {
            console.log("Canvas agregado al DOM...");
        }

        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }
        onModelChanged() {
            this._view.render(this._model.getLineData());
        }
        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;



</script>


</html>
