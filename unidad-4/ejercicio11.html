<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 11</title>
</head>

<body>


</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();

            this.lineData = {
                width: 800,
                height: 800,
                separation: 15,
                dottedPattern: [10, 5],
                diagonalOffset: 100
            };
        }

        getLineData() {
            return this.lineData;
        }
        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {

        constructor() {
            super()
            this.canvas = document.createElement("canvas")
            this.canvas.width = 800
            this.canvas.height = 800
            this.canvas.style = "border: 1px solid black; "
            this.pincel2D = this.canvas.getContext("2d")

            this.h1 = document.createElement("h1")
            this.h1.textContent = "11) Líneas punteadas (setLineDash): Construir una función que dibuje una grilla de líneas diagonales separadas cada 15px, alternando patrones de trazos continuos y punteados."

            this.appendChild(this.h1)
            this.appendChild(this.canvas)

        }

        drawLines(data) {
            let indiceLinea = 0;

            for (let posicionX = 0; posicionX < this.canvas.width; posicionX += data.separation) {
                this.pincel2D.beginPath();

                if (indiceLinea % 2 === 0) {
                    this.pincel2D.setLineDash([]);
                } else {
                    this.pincel2D.setLineDash(data.dottedPattern);
                }

                this.pincel2D.moveTo(posicionX, 0);

                this.pincel2D.lineTo(posicionX + data.diagonalOffset, this.canvas.height);

                this.pincel2D.stroke();

                indiceLinea++;
            }

            // Deja el contexto nuevamente en modo continuo
            this.pincel2D.setLineDash([]);
        }

        render(data) {
            this.canvas.width = data.width;
            this.canvas.height = data.height;

            this.drawLines(data);
        }

        connectedCallback() {
            console.log("Canvas agregado al DOM...");
        }

        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged() {
            this._view.render(this._model.getLineData());
        }

        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;



</script>

</html>
