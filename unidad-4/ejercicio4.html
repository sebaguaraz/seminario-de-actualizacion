<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 4</title>
</head>

<body>

</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();

            this.circleData = {
                width: 500,
                height: 500,
                separation: 25
            };
        }

        getCircleData() {
            return this.circleData;
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {

        constructor() {
            super()
            this.canvas = document.createElement("canvas")
            this.canvas.width = 500
            this.canvas.height = 500
            this.canvas.style = "border: 1px solid black; "
            this.pincel2D = this.canvas.getContext("2d")

            this.h1 = document.createElement("h1")
            this.h1.textContent = "4) Configurar el área de dibujo para tener forma de cuadrado de (500,500)px. Empleando las primitivas de dibujo de arcos de elipse, dibujar círculos concéntricos hasta el centro del área, espaciados en 25px c/u."


            this.appendChild(this.h1)
            this.appendChild(this.canvas)

        }

        drawCircles(centerX, centerY, anguloI, anguloF, radioMaximo, separation) {
            let radioActual = radioMaximo;

            while (radioActual >= separation) {
                this.pincel2D.beginPath();

                this.pincel2D.arc(
                    centerX,
                    centerY,
                    radioActual,
                    anguloI,
                    anguloF
                );

                this.pincel2D.stroke();

                radioActual -= separation;
            }
        }

        render(data) {

            this.pincel2D.clearRect(0, 0, this.canvas.width, this.canvas.height);

            const centerX = data.width / 2;
            const centerY = data.height / 2;

            const anguloI = 0;
            const anguloF = 2 * Math.PI;
            const radioMaximo = data.width / 2;

            this.drawCircles(
                centerX,
                centerY,
                anguloI,
                anguloF,
                radioMaximo,
                data.separation
            );
        }

        connectedCallback() {
            console.log("Canvas (lienzo) agregado al DOM...");
        }

        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged() {
            this._view.render(this._model.getCircleData());
        }

        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;

</script>

</html>
