<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 7</title>
</head>

<body>
</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();

            this.graphicData = {
                values: [0.30, 0.50, 0.10, 0.10],
                colors: ["red", "blue", "green", "orange"]
            };
        }

        getGraphicData() {
            return this.graphicData;
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {

        constructor() {
            super()
            this.canvas = document.createElement("canvas")
            this.canvas.width = 500
            this.canvas.height = 500
            this.canvas.style = "border: 1px solid black; "
            this.pincel2D = this.canvas.getContext("2d")

            this.h1 = document.createElement("h1")
            this.h1.textContent = "7) Dado un objeto de datos: [ 0.30, 0.50, 0.10, 0.10 ] que representa información porcentual, elaborar una función que procese el array y dibuje la representación visual como un gráfico de torta mostrando el valor del porcentaje como texto."

            this.appendChild(this.h1)
            this.appendChild(this.canvas)

        }

        drawGraphic(list, colors) {
            let anguloInicial = 0;
            const radio = 100;

            const centerX = this.canvas.width / 2;
            const centerY = this.canvas.height / 2;

            for (let index = 0; index < list.length; index++) {
                const sectorSize = list[index] * 2 * Math.PI;
                const anguloFinal = anguloInicial + sectorSize;

                this.pincel2D.beginPath();
                this.pincel2D.moveTo(centerX, centerY);

                this.pincel2D.arc(centerX, centerY, radio, anguloInicial, anguloFinal);

                this.pincel2D.closePath();

                this.pincel2D.fillStyle = colors[index];
                this.pincel2D.fill();

                this.pincel2D.strokeStyle = "black";
                this.pincel2D.stroke();

                this.pincel2D.fillStyle = "black";
                this.pincel2D.fillText(`${list[index] * 100}%`, centerX + 120, 100 + index * 30);

                anguloInicial = anguloFinal;
            }
        }

        render(data) {

            this.pincel2D.clearRect(0, 0, this.canvas.width, this.canvas.height);

            this.drawGraphic(data.values, data.colors);
        }

        connectedCallback() {
            console.log("Canvas agregado al DOM...");
        }

        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }
        onModelChanged() {
            this._view.render(this._model.getGraphicData());
        }
        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;


</script>

</html>
