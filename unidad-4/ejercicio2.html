<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 2</title>
</head>

<body>


</body>

<script>


    class Model extends EventTarget {
        constructor() {
            super();

            this.triangle = {
                pointA: { x: 400, y: 220 },
                pointB: { x: 450, y: 380 },
                pointC: { x: 350, y: 380 }
            };
        }

        getTriangle() {
            return this.triangle;
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {

        constructor() {
            super();

            this.canvas = document.createElement("canvas");
            this.canvas.width = 800;
            this.canvas.height = 600;
            this.canvas.style = "border: 1px solid black";
            this.pincel2D = this.canvas.getContext("2d");

            this.h1 = document.createElement("h1");
            this.h1.textContent = "2) Construya una función que permita dibujar un triángulo dado sus tres vértices en el centro del área de dibujo.";

            this.appendChild(this.h1);
            this.appendChild(this.canvas);
        }


        drawTriangle(triangle) {
            this.pincel2D.beginPath();

            this.pincel2D.moveTo(
                triangle.pointA.x,
                triangle.pointA.y
            );

            this.pincel2D.lineTo(
                triangle.pointB.x,
                triangle.pointB.y
            );

            this.pincel2D.lineTo(
                triangle.pointC.x,
                triangle.pointC.y
            );

            this.pincel2D.closePath();
            this.pincel2D.stroke();
        }

        connectedCallback() {
            console.log('Canvas (lienzo) agregado al DOM...')

        }
        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener("changed", this._onModelChanged);

            this._view.addEventListener("request", this._onViewRequest);

            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged() {
            this._view.drawTriangle(this._model.getTriangle());
        }
        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;

</script>

</html>
