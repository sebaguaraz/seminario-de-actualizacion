<!DOCTYPE html>
<html lang="en">

<head>

<body>

    <script>

        //* 2. Construya una función que le permita dibujar un triángulo dado sus tres vértices en el centro del área de dibujo.

        class Model extends EventTarget {
            constructor() {
                super();

            }

            changed() {
                this.dispatchEvent(new CustomEvent('changed'));
            }
        }


        class View extends HTMLElement {

            constructor() {
                super()
                this.canvas = document.createElement("canvas")
                this.canvas.width = 800
                this.canvas.height = 600
                this.canvas.style = "border: 1px solid black; "
                this.pincel2D = this.canvas.getContext("2d")

                let centerX = this.canvas.width / 2
                let centerY = this.canvas.height / 2
                let despHorizontal = 50;
                let despVertical = 80;

                const triangle = {
                    pointA: {
                        x1: centerX,
                        y1: centerY - despVertical
                    },
                    pointB: {
                        x2: centerX + despHorizontal,
                        y2: centerY + despVertical
                    },

                    pointC: {
                        x3: centerX - despHorizontal,
                        y3: centerY + despVertical,


                    }
                }


                this.drawTriangle(triangle)

                this.appendChild(this.canvas)

            }


            drawTriangle(triangle) {
                this.pincel2D.beginPath()
                this.pincel2D.moveTo(triangle.pointA.x1, triangle.pointA.y1)
                this.pincel2D.lineTo(triangle.pointB.x2, triangle.pointB.y2)
                this.pincel2D.lineTo(triangle.pointC.x3, triangle.pointC.y3)
                this.pincel2D.closePath()
                this.pincel2D.stroke()

            }

            set value(x) {

            }

            get value() {

            }
            connectedCallback() {
                console.log('Canvas (lienzo) agregado al DOM...')

            }
            disconnectedCallback() {

            }

            _onSave() {

            }
        }
        customElements.define('x-view', View);


        class Controller {
            constructor(view, model) {
                this._view = view;
                this._model = model;
                this._onModelChanged = this.onModelChanged.bind(this);
                this._onViewRequest = this.onViewRequest.bind(this);
            }
            enable() {
                this._model.addEventListener('changed', this._onModelChanged);
                this._view.addEventListener('request', this._onViewRequest);
            }
            disable() {
                this._model.removeEventListener('changed', this._onModelChanged);
                this._view.removeEventListener('request', this._onViewRequest);
            }
            onModelChanged() {

            }
            onViewRequest(event) {

            }
        }

        function main() {
            let myModel = new Model();
            let myView = new View();
            let myController = new Controller(myView, myModel);
            myController.enable();
            document.body.appendChild(myView);
        }
        window.onload = main;

    </script>

</body>

</html>
