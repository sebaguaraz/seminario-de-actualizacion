<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 5</title>
</head>

<body>

</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();

            this.dartData = {
                width: 500,
                height: 500,
                separation: 50,
                scores: [1000, 750, 500, 100, 50]
            };
        }

        getDartData() {
            return this.dartData;
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }

    }


    class View extends HTMLElement {

        constructor() {
            super()
            this.canvas = document.createElement("canvas")
            this.canvas.width = 500
            this.canvas.height = 500
            this.canvas.style = "border: 1px solid black; "
            this.pincel2D = this.canvas.getContext("2d")

            this.h1 = document.createElement("h1")
            this.h1.textContent = "5) Reutilizando el código del punto anterior, y empleando las primitivas de dibujado de texto. Construir un tablero de dardos, en donde se reparta el área del cuadrado para que entren hasta 5 círculos concéntricos. Entre el espacio de cada círculo, se deberá distribuir el valor de puntaje según el array: [1000, 750, 500, 100, 50] donde el centro representa el mayor valor."

            this.appendChild(this.h1)
            this.appendChild(this.canvas)

        }

        drawTableDardes(X, Y, radioMaximo, anguloI, anguloF, separation, listNumber) {
            let radioActual = separation;
            let indicePuntaje = 1;
            let posicionTexto = Y - separation - separation / 2;

            this.pincel2D.textAlign = "center";
            this.pincel2D.textBaseline = "middle";

            // Puntaje del centro
            this.pincel2D.fillText(listNumber[0], X, Y);

            while (radioActual <= radioMaximo) {
                this.pincel2D.beginPath();

                this.pincel2D.arc(X, Y, radioActual, anguloI, anguloF);

                this.pincel2D.stroke();

                if (indicePuntaje < listNumber.length) {
                    this.pincel2D.fillText(listNumber[indicePuntaje], X, posicionTexto);

                    indicePuntaje++;
                    posicionTexto -= separation;
                }

                radioActual += separation;
            }
        }

        render(data) {

            this.pincel2D.clearRect(0, 0, this.canvas.width, this.canvas.height);

            const X = data.width / 2;
            const Y = data.height / 2;

            const radioMaximo = data.width / 2;
            const anguloI = 0;
            const anguloF = 2 * Math.PI;

            this.drawTableDardes(X, Y, radioMaximo, anguloI, anguloF, data.separation, data.scores);
        }

        connectedCallback() {
            console.log("Canvas agregado al DOM...");
        }
        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged() {
            this._view.render(this._model.getDartData());
        }

        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;

</script>

</html>
