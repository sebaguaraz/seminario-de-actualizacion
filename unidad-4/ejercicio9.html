<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 9</title>
</head>

<body>



</body>


<script>

    class Model extends EventTarget {
        constructor() {
            super();

            this.lineData = {
                width: 800,
                height: 500,
                spacing: 16,
                maxWidth: 25
            };
        }

        getLineData() {
            return this.lineData;
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {

        constructor() {
            super()
            this.canvas = document.createElement("canvas")
            this.canvas.width = 800
            this.canvas.height = 500
            this.canvas.style = "border: 1px solid black; "
            this.pincel2D = this.canvas.getContext("2d")

            this.h1 = document.createElement("h1")
            this.h1.textContent = "9) Construir un muestrario de líneas verticales de grosor creciente, variando desde 1px hasta 25px con un espaciado de 16px entre cada una. Cada línea debe tener el mismo alto del área de dibujo."

            this.appendChild(this.h1)
            this.appendChild(this.canvas)

        }

        drawLines(spacing, maxWidth) {
            let posicionX = spacing;

            for (let grosorActual = 1; grosorActual <= maxWidth; grosorActual++) {
                this.pincel2D.beginPath();

                this.pincel2D.lineWidth = grosorActual;

                const centroLinea = posicionX + grosorActual / 2;

                this.pincel2D.moveTo(centroLinea, 0);
                this.pincel2D.lineTo(centroLinea, this.canvas.height);

                this.pincel2D.stroke();

                posicionX += grosorActual + spacing;
            }
        }

        render(data) {
            this.pincel2D.clearRect(0, 0, this.canvas.width, this.canvas.height);

            this.drawLines(data.spacing, data.maxWidth);
        }

        connectedCallback() {
            console.log("Canvas agregado al DOM...");
        }

        disconnectedCallback() {

        }

    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged() {
            this._view.render(this._model.getLineData());
        }

        onViewRequest(event) {

        }
    }

    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }
    window.onload = main;



</script>


</html>
