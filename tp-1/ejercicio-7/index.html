<body>

<script>
    class Data_Meteorologico {
        constructor() {
            this.meses = [
                // Corregido "temp_max_abs" en todos los meses para que coincida
                { name: "Enero", "Temp Max Abs": 42.4, "Temp Max Media": 26.3, "Temp Media": 20.3, "Temp Min Media": 14.3, "Temp Min Abs": 4.7, "Precipitacion Total": 100.1, "Dias Precipitacion": 9, "Horas Sol": 288.3, "Humedad Relativa": 76 },
                { name: "Febrero", "Temp Max Abs": 38.1, "Temp Max Media": 25.8, "Temp Media": 19.9, "Temp Min Media": 14.1, "Temp Min Abs": 1.2, "Precipitacion Total": 72.8, "Dias Precipitacion": 8, "Horas Sol": 234.5, "Humedad Relativa": 77 },
                { name: "Marzo", "Temp Max Abs": 36.3, "Temp Max Media": 23.7, "Temp Media": 18.0, "Temp Min Media": 12.5, "Temp Min Abs": 1.9, "Precipitacion Total": 107.0, "Dias Precipitacion": 9, "Horas Sol": 232.5, "Humedad Relativa": 79 },
                { name: "Abril", "Temp Max Abs": 32.5, "Temp Max Media": 20.5, "Temp Media": 14.6, "Temp Min Media": 9.1, "Temp Min Abs": -1.0, "Precipitacion Total": 73.3, "Dias Precipitacion": 9, "Horas Sol": 195.0, "Humedad Relativa": 81 },
                { name: "Mayo", "Temp Max Abs": 27.4, "Temp Max Media": 16.8, "Temp Media": 11.3, "Temp Min Media": 6.4, "Temp Min Abs": -3.0, "Precipitacion Total": 73.5, "Dias Precipitacion": 9, "Horas Sol": 167.4, "Humedad Relativa": 83 },
                { name: "Junio", "Temp Max Abs": 22.2, "Temp Max Media": 13.8, "Temp Media": 8.5, "Temp Min Media": 4.1, "Temp Min Abs": -5.5, "Precipitacion Total": 54.9, "Dias Precipitacion": 9, "Horas Sol": 120.0, "Humedad Relativa": 84 },
                { name: "Julio", "Temp Max Abs": 27.7, "Temp Max Media": 13.1, "Temp Media": 8.1, "Temp Min Media": 3.8, "Temp Min Abs": -9.3, "Precipitacion Total": 58.9, "Dias Precipitacion": 9, "Horas Sol": 127.1, "Humedad Relativa": 81 },
                { name: "Agosto", "Temp Max Abs": 24.7, "Temp Max Media": 14.4, "Temp Media": 8.9, "Temp Min Media": 4.0, "Temp Min Abs": -6.4, "Precipitacion Total": 64.0, "Dias Precipitacion": 8, "Horas Sol": 164.3, "Humedad Relativa": 81 },
                { name: "Septiembre", "Temp Max Abs": 28.8, "Temp Max Media": 16.0, "Temp Media": 10.5, "Temp Min Media": 5.3, "Temp Min Abs": -5.5, "Precipitacion Total": 56.4, "Dias Precipitacion": 7, "Horas Sol": 174.0, "Humedad Relativa": 80 },
                { name: "Octubre", "Temp Max Abs": 34.4, "Temp Max Media": 18.5, "Temp Media": 13.1, "Temp Min Media": 7.6, "Temp Min Abs": -3.0, "Precipitacion Total": 83.4, "Dias Precipitacion": 10, "Horas Sol": 210.8, "Humedad Relativa": 80 },
                { name: "Noviembre", "Temp Max Abs": 35.7, "Temp Max Media": 21.7, "Temp Media": 15.9, "Temp Min Media": 10.1, "Temp Min Abs": -2.0, "Precipitacion Total": 75.3, "Dias Precipitacion": 10, "Horas Sol": 222.0, "Humedad Relativa": 77 },
                { name: "Diciembre", "Temp Max Abs": 39.4, "Temp Max Media": 24.4, "Temp Media": 18.5, "Temp Min Media": 12.7, "Temp Min Abs": -0.2, "Precipitacion Total": 104.0, "Dias Precipitacion": 10, "Horas Sol": 269.7, "Humedad Relativa": 76 },

                { name: "Anual", "Temp Max Abs": 39.4, "Temp Max Media": 19.6, "Temp Media": 14.0, "Temp Min Media": 8.7, "Temp Min Abs": -9.3, "Precipitacion Total": 923.6, "Dias Precipitacion": 107, "Horas Sol": 2405.6, "Humedad Relativa": 80 }
            ]
        }
    }

    class Meteorologico extends HTMLElement {
        constructor(object_data) {
            super();
            this.data = object_data;
            this.h1 = document.createElement("h1");
            this.h1.textContent = "Meteorologico";
            this.appendChild(this.h1);
            this.table = document.createElement("table");
            this.appendChild(this.table);

            this.btt_averages = document.createElement("button");
            this.btt_averages.type = "button";
            this.btt_averages.textContent = "Promedio de temperaturas anuales";
            this.appendChild(this.btt_averages);
            this.div = document.createElement("div");
            this.appendChild(this.div);

            this.is_Celcius = true;
            this.bttn_change_temp = document.createElement("button");
            this.bttn_change_temp.type = "button";
            this.bttn_change_temp.textContent = "Alternar Temperaturas";
            this.appendChild(this.bttn_change_temp);

            this.newList = [];
        }

        showHeader() {
            this.tr = document.createElement("tr");
            this.tr.classList.add("header-row");
            this.th_mes = document.createElement("th");
            this.th_mes.textContent = "Mes";
            this.th_mes.classList.add("corner-header");

            this.tr.appendChild(this.th_mes);


            // Encabezados de la tabla con los nombres de las columnas

            this.data.meses.forEach(element => {
                const th = document.createElement("th");
                th.textContent = element.name;
                th.classList.add("tdata", "month-header");
                if (element.name === "Anual") {
                    th.classList.add("annual-header");
                }
                this.tr.appendChild(th);
            });

            this.table.appendChild(this.tr);

        }

        showBody() {

            const propiedades = ["Temp Max Abs", "Temp Max Media", "Temp Media", "Temp Min Media", "Temp Min Abs", "Precipitacion Total", "Dias Precipitacion", "Horas Sol", "Humedad Relativa"];
            const estiloFilas = {
                "Temp Max Abs": "temp-max-abs",
                "Temp Max Media": "temp-max-media",
                "Temp Media": "temp-media",
                "Temp Min Media": "temp-min-media",
                "Temp Min Abs": "temp-min-abs",
                "Precipitacion Total": "precipitacion-total",
                "Dias Precipitacion": "dias-precipitacion",
                "Horas Sol": "horas-sol",
                "Humedad Relativa": "humedad-relativa"
            };

            for (const element of propiedades) {

                const row = document.createElement("tr");

                row.classList.add("tdata", estiloFilas[element]);

                const td1 = document.createElement("td");

                td1.textContent = element;
                td1.classList.add("tdata", "row-label");

                row.appendChild(td1);
                // RECORRER EL ARRAY ELEMENTO POR ELEMENTO
                for (const mes of this.data.meses) {

                    const tdAux = document.createElement("td");

                    tdAux.textContent = mes[element];
                    tdAux.classList.add("tdata", "value-cell");
                    if (mes.name === "Anual") {
                        tdAux.classList.add("annual-cell");
                    }
                    row.appendChild(tdAux);

                }
                this.table.appendChild(row);
            }

        }


        showAveragesTemp() {

            this.div.textContent = "";

            const p = document.createElement("p");

            let aux = ""
            let acumulador = 0;

            const propiedades = ["Temp Max Abs", "Temp Max Media", "Temp Media", "Temp Min Media", "Temp Min Abs"];

            const meses = this.data.meses.filter(mes => mes.name !== "Anual");

            let promedio = 0;

            for (let prop of propiedades) {

                acumulador = 0

                for (const element of meses) {


                    acumulador += element[prop];

                    promedio = acumulador / meses.length;


                }
                aux += "<br>" + prop + ": " + promedio + "<br>";
            }
            p.innerHTML = aux;

            this.div.appendChild(p);

        }


        renderTable() {
            const propiedades = ["Temp Max Abs", "Temp Max Media", "Temp Media", "Temp Min Media", "Temp Min Abs", "Precipitacion Total", "Dias Precipitacion", "Horas Sol", "Humedad Relativa"];
            const estiloFilas = {
                "Temp Max Abs": "temp-max-abs",
                "Temp Max Media": "temp-max-media",
                "Temp Media": "temp-media",
                "Temp Min Media": "temp-min-media",
                "Temp Min Abs": "temp-min-abs",
                "Precipitacion Total": "precipitacion-total",
                "Dias Precipitacion": "dias-precipitacion",
                "Horas Sol": "horas-sol",
                "Humedad Relativa": "humedad-relativa"
            };

            for (const element of propiedades) {

                const row = document.createElement("tr");

                row.classList.add("tdata", estiloFilas[element]);

                const td1 = document.createElement("td");

                td1.textContent = element;
                td1.classList.add("tdata", "row-label");

                row.appendChild(td1);
                // RECORRER EL ARRAY ELEMENTO POR ELEMENTO
                for (const mes of this.data.meses) {

                    let aux_Value = null
                    const td = document.createElement("td");

                    if (element.includes("Temp")) {
                        if (this.is_Celcius) {
                            aux_Value = `${mes[element]}°C`
                        }
                        else {
                            aux_Value = `${(mes[element] * 1.8) + 32}°F`
                        }

                    } else {
                        aux_Value = mes[element]
                    }

                    td.textContent = aux_Value;
                    td.classList.add("tdata", "value-cell");

                    row.appendChild(td);

                }
                this.table.appendChild(row);
            }

        }

        change_Conversion() {

            this.is_Celcius = !this.is_Celcius

            if (this.is_Celcius) {
                this.bttn_change_temp.textContent = "Ver en Farenheit"
                this.table.innerText = "";
                this.showHeader();
                this.renderTable();
            } else {
                this.bttn_change_temp.textContent = "Ver en Celcius"
                this.table.innerText = "";
                this.showHeader();
                this.renderTable();
            }

        }

        connectedCallback() {

            this.btt_averages.onclick = this.showAveragesTemp.bind(this);
            this.bttn_change_temp.onclick = this.change_Conversion.bind(this)

            this.showHeader();


            this.renderTable()
        }


        disconnectedCallback() {
            this.btt_averages.onclick = null;
        }


    }

    customElements.define("meteorologico-x", Meteorologico);

    function main() {
        const object_data = new Data_Meteorologico()
        const meteorologico = new Meteorologico(object_data);
        document.body.appendChild(meteorologico);
    }

    window.onload = main;
</script>

</html>
