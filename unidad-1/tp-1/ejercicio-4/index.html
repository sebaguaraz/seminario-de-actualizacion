<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

</body>


<script>

    class formChat extends HTMLElement {
        constructor() {

            super()

            this.form = document.createElement("form")
            this.input = document.createElement("input")
            this.input.name = "dataMessage"
            this.input.placeholder = "Ingrese mensaje"
            this.bttn = document.createElement("button")
            this.bttn.type = "submit"
            this.bttn.textContent = "Send"

            this.form.appendChild(this.input)
            this.form.appendChild(this.bttn)
            this.appendChild(this.form)



        }

        getInformation() {
            return {
                dataMessage: this.input.value,
                time: new Date().toLocaleTimeString()
            };


        }

        connectedCallback() {

        }


        disconnectedCallback() {

            this.form.onsubmit = null;
        }
    }


    class SentMessage extends HTMLElement {

        constructor(dataMessage, time) {

            super()

            this.contenedor = document.createElement("div")
            this.img = document.createElement("img")
            this.texto = document.createElement("p")
            this.span = document.createElement("span")

            this.texto.textContent = dataMessage
            this.span.textContent = time

            this.contenedor.className = "container"
            this.img.className = ""
            this.img.src = "./img/bandmember.jpg"
            this.img.alt = "Avatar"


            this.span.className = "time-right"

            this.contenedor.appendChild(this.img)
            this.contenedor.appendChild(this.texto)
            this.contenedor.appendChild(this.span)

            this.appendChild(this.contenedor)

        }

        connectedCallback() { }


        disconnectedCallback() { }
    }

    class ReceiveMessage extends HTMLElement {


        constructor(dataMessage, time) {

            super()

            this.contenedor = document.createElement("div")
            this.img = document.createElement("img")
            this.texto = document.createElement("p")
            this.span = document.createElement("span")

            this.texto.textContent = dataMessage
            this.span.textContent = time

            this.contenedor.className = "container darker"
            this.img.className = "right"
            this.img.src = "./img/avatar_g2.jpg"
            this.img.alt = "Avatar"

            this.span.className = "time-left"

            this.contenedor.appendChild(this.img)
            this.contenedor.appendChild(this.texto)
            this.contenedor.appendChild(this.span)

            this.appendChild(this.contenedor)

        }

        connectedCallback() { }


        disconnectedCallback() { }
    }
    //addeventlistener, removeeventlistener, funcion flecha, funcion anonima 


    class Chat extends HTMLElement {

        constructor() {

            super()

            this.form_Chat = new formChat()

            this.listMessages = document.createElement("div")
            this.listMessages.className = "listMessages"
            this.appendChild(this.listMessages)

        }

        //Paso los datos para encapsular la implementacion, se debe saber que hace pero no como lo hace
        sendMessage(dataMessage, time) {

            let newMessage = new SentMessage(dataMessage, time)

            this.listMessages.appendChild(newMessage);


        }

        receiveMessage(dataMessage, time) {

            let newMessage = new ReceiveMessage(dataMessage, time)

            this.listMessages.appendChild(newMessage);


        }

        addForm() {

            this.appendChild(this.form_Chat)
        }

        onInputValue(event) {
            event.preventDefault()
            this.sendNewMessage()
        }

        sendNewMessage() {
            let object_input = this.form_Chat.getInformation()

            let { dataMessage, time } = object_input;

            let newMessage = new SentMessage(dataMessage, time)

            this.form_Chat.input.value = ""

            this.listMessages.appendChild(newMessage)

        }

        connectedCallback() {

            this.form_Chat.form.onsubmit = this.onInputValue.bind(this)
        }


        disconnectedCallback() {
            this.form_Chat.form.onsubmit = null
        }
    }

    customElements.define("chat-x", Chat)
    customElements.define("message-receive", ReceiveMessage)
    customElements.define("message-sent", SentMessage)
    customElements.define("form-x", formChat)


    function main() {

        const viewObject = new Chat()

        viewObject.sendMessage("Hello. How are you today?", "11:00")
        viewObject.receiveMessage("Hey! I'm fine. Thanks for asking!", "11:01")
        viewObject.sendMessage("Sweet! So, what do you wanna do today?", "11:02")
        viewObject.receiveMessage("Nah, I dunno. Play soccer.. or learn more coding perhaps?", "11:05")

        viewObject.addForm()

        document.body.appendChild(viewObject)

    }

    window.onload = main




</script>


</html>
